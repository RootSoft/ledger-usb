name: Analyze

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install asdf & tools
        uses: asdf-vm/actions/install@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze
